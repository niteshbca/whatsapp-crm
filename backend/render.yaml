databases:
  - name: whatsapp-crm-db
    databaseName: whatsapp_crm
    user: whatsapp_crm
    plan: free
    region: singapore

services:
  - type: static
    name: whatsapp-crm-frontend
    rootDir: frontend
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
        value: https://whatsapp-crm-backend.onrender.com/api
  - type: web
    name: whatsapp-crm-backend
    runtime: php
    rootDir: backend
    plan: free
    region: singapore
    healthCheckPath: /up
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: bash start.sh
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        fromService:
          name: whatsapp-crm-backend
          type: web
          property: url
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: whatsapp-crm-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: whatsapp-crm-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: whatsapp-crm-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: whatsapp-crm-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: whatsapp-crm-db
          property: password
      - key: SESSION_DRIVER
        value: cookie
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: database
      - key: PROVIDER_TOKEN
        generateValue: true
